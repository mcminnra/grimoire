[package]
name = "grimoire"
version = "0.1.0"
description = "Video game journaling system"
authors = [""]
license = "GPL-3.0-or-later"
edition = "2024"

[lib]
# NOTE: Lib name must differ from the bin name to avoid a Windows PDB collision.
# See https://github.com/rust-lang/cargo/issues/8519
name = "grimoire_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
