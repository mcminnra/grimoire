[tools]
node = "26"
pnpm = "12"
rust = "stable"

[tasks.install]
description = "Install JS dependencies"
run = "pnpm install"

[tasks.dev]
description = "Run the app in dev mode"
run = "pnpm tauri dev"

[tasks.build]
description = "Build a release bundle"
run = "pnpm tauri build"

[tasks.check]
description = "Run frontend and backend checks"
run = ["pnpm check", "cargo check --manifest-path src-tauri/Cargo.toml"]

[tasks.ci]
description = "Run checks, then build"
run = ["mise run check", "mise run build"]
